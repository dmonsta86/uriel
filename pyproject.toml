[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uriel-research"
version = "1.0.0rc2"
description = "Offline-first, evidence-bound research development, verification, repair, and submission toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Uriel contributors"}]
keywords = [
  "research-integrity",
  "open-science",
  "reproducibility",
  "provenance",
  "data-quality",
  "research-software",
  "scholarly-communication",
  "offline-first",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dmonsta86/uriel"
Repository = "https://github.com/dmonsta86/uriel"
Issues = "https://github.com/dmonsta86/uriel/issues"
Documentation = "https://github.com/dmonsta86/uriel#readme"

[project.scripts]
uriel = "uriel.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uriel = ["py.typed", "schemas/*.json", "data/lens/*"]
