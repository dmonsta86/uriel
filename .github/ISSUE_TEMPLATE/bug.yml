name: Bug report
about: Report a reproducible Uriel defect using synthetic or public data
body:
  - type: markdown
    attributes:
      value: Do not include confidential research data, credentials, or private provider output.
  - type: input
    id: version
    attributes:
      label: Uriel version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands and a synthetic fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: integrity
    attributes:
      label: Integrity impact
      description: Could this cause a false pass, false refusal, path escape, stale receipt, or forged Blessing?
