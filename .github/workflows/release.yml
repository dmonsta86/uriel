name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install release tooling
        run: python -m pip install --upgrade pip "setuptools>=77" wheel build

      - name: Run full release checks
        run: python scripts/release_check.py --full --command-timeout 600

      - name: Stage and verify the release transcript
        shell: bash
        run: |
          cp release-check.txt dist/release-check.txt
          grep -q '^STATUS: PASS$' dist/release-check.txt
          grep -q '^RESULT: PASS$' dist/release-check.txt
          python scripts/make_checksums.py --directory dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          extra=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            extra+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Updating release assets..."
            gh release upload "${GITHUB_REF_NAME}" \
              dist/*.whl \
              dist/*.tar.gz \
              dist/*.pyz \
              dist/SHA256SUMS.txt \
              dist/release-check.txt \
              --clobber
          else
            echo "Creating new release ${GITHUB_REF_NAME}..."
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.whl \
              dist/*.tar.gz \
              dist/*.pyz \
              dist/SHA256SUMS.txt \
              dist/release-check.txt \
              --verify-tag \
              --generate-notes \
              --title "Uriel ${GITHUB_REF_NAME}" \
              "${extra[@]}"
          fi

