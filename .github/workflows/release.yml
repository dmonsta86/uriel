name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install release tooling
        run: python -m pip install --upgrade setuptools wheel
      - name: Run full release checks
        run: python scripts/release_check.py --full --command-timeout 600
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz dist/*.pyz dist/SHA256SUMS.txt dist/release-check.txt \
            --verify-tag \
            --generate-notes \
            --title "Uriel ${GITHUB_REF_NAME}"
